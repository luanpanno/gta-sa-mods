; ArmageddonPlus settings. Edit this file in the repo (config/ArmageddonPlus.ini);
; scripts/deploy.ps1 copies it next to the .asi. Restart the game to apply.
;
; Keys: F1-F24, A-Z, 0-9, NUMPAD0-9, SHIFT, CTRL, ALT, SPACE, TAB, INSERT, DELETE, HOME, END,
;       PAGEUP, PAGEDOWN, UP, DOWN, LEFT, RIGHT, LMB, RMB, MMB, 0x?? (hex VK code), NONE
; Taken by our CLEO scripts: F5 (hello), F6/F7/F8 (vehicle spawner), F9 (console)

[Debug]
Overlay=1          ; power list in the top-right corner
OverlayKey=F12     ; show/hide it

[Power.Invulnerability]
Key=F4

[Power.SpawnVehicle]
Key=F11
Model=411          ; 400-611, e.g. 411 Infernus, 520 Hydra, 432 Rhino
