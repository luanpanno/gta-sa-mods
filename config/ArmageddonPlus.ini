; ArmageddonPlus settings. Edit this file in the repo (config/ArmageddonPlus.ini);
; scripts/deploy.ps1 copies it next to the .asi. Restart the game to apply.
;
; Powers are controlled from the menu. Shortcuts: bind them IN THE MENU (Insert on a power);
; they're saved to ArmageddonPlus.user.ini in the game folder. You can also preset Key=<key> here.
; A shortcut steps its power: off -> level 1 -> 2 -> 3 -> off (powers without levels: on / off).
; Keys: F2-F24, A-Z, 0-9, NUMPAD0-9, SHIFT, CTRL, ALT, SPACE, TAB, INSERT, DELETE, HOME, END,
;       PAGEUP, PAGEDOWN, UP, DOWN, LEFT, RIGHT, LMB, RMB, MMB, 0x?? (hex VK code), NONE
; Never F1: it makes the game stop reading the keyboard.
; Taken by our CLEO scripts: F5 (hello), F6/F7/F8 (vehicle spawner), F9 (console)

[Menu]
Key=F10            ; open/close the power menu (arrows, Enter, Backspace inside it)
Scale=1.0          ; size of the menu and HUD (0.5-2.5). Try 1.2 on big screens

[Energy]
; one shared energy bar (top-right). Also switchable in the menu (Off = infinite energy).
; Each power below: DrainN = per second while on, CostN = per action (N = level; Drain/Cost = all levels)
Enabled=1
Max=100
Regen=8            ; per second, after...
RegenDelay=1.5     ; ...this many seconds without spending
MinToStart=5       ; energy needed to switch on a draining power

[Effects]
Particles=1        ; dust, flashes (the game's own particle effects)
Sounds=1           ; power sounds (synthesized; replace with your own: sounds\<name>.wav next to the .asi)
Volume=0.8         ; 0-1

[Debug]
Overlay=1          ; power list in the top-right corner (also switchable in the menu)

[Power.Flight]
; W/S = fly where the camera looks, A/D = strafe, no keys = hover
; levels: 1 cruise, 2 fast, 3 very fast
Speed1=12          ; m/s
Speed2=30
Speed3=60
Climb1=8           ; m/s straight up/down
Climb2=18
Climb3=35
AscendKey=SPACE
DescendKey=C
Responsiveness=4.0 ; how quickly he reacts to the keys (higher = snappier, lower = floatier)
FollowCameraPitch=1 ; 1 = look up + W climbs; 0 = W stays level
Poses=1            ; Superman poses (0 = game's default falling animation)
FlyAnim=FALL_SkyDive_Accel   ; pose while moving (head-first dive)
FlyAnimFile=PARACHUTE
HoverAnim=Swim_Tread         ; pose while hovering (upright, treading water)
HoverAnimFile=PED
Drain1=3
Drain2=5
Drain3=8

[Power.SuperSpeed]
; levels: 1 fast, 2 faster, 3 super fast
; per level: ground speed vs normal (1.0 = normal)
Multiplier1=2.5
Multiplier2=4.5
Multiplier3=8.0
; per level: how fast the legs move (visual only)
AnimSpeed1=1.3
AnimSpeed2=1.6
AnimSpeed3=2.0
; per level: jump take-off speed (normal jump ~0.1; 0.4 ~ 10 m high, 0.65 ~ 26 m, 1.0 ~ 60 m; 0 = normal jump)
Jump1=0.40
Jump2=0.65
Jump3=1.00
NoFatigue=1        ; never get tired while it's on
Drain1=1.5
Drain2=3
Drain3=6

[Power.SuperJump]
; jump as usual (much higher and longer). levels: 1 High, 2 Higher, 3 Sky (lands with a ground pound)
Jump1=0.55         ; take-off speed (~19 m high)
Jump2=0.90         ; (~50 m)
Jump3=1.40         ; (~120 m)
Forward1=1.5       ; horizontal speed multiplier: longer jumps
Forward2=2.2
Forward3=3.0
PoundRadius3=12    ; m: ground-pound shockwave on landing (0 = none)
PoundSpeed3=25     ; m/s
Cost1=3            ; energy per jump
Cost2=5
Cost3=8

[Power.ExplosionPunch]
; each punch: victim launched away + big blast on it + a ring of blasts around + shockwave
; levels: 1 car-bomb blast, 2 car-bomb + bigger ring, 3 aircraft-size blast
RingBlasts1=2      ; extra explosions around the victim
RingBlasts2=4
RingBlasts3=7
RingRadius1=3      ; m
RingRadius2=5
RingRadius3=8
ShockRadius1=10    ; m: everything this close gets thrown
ShockRadius2=16
ShockRadius3=26
ShockSpeed1=18     ; m/s at the center
ShockSpeed2=30
ShockSpeed3=48
Launch1=25         ; m/s: how hard the victim flies away
Launch2=40
Launch3=60
Cooldown=0.25      ; seconds between blasts
Cost1=5
Cost2=10
Cost3=18

[Power.Telekinesis]
; CJ draws a pistol (can't fire): aim (RMB) + click (LMB) = grab, hold LMB = carry, release = throw
; levels: throw strength. Can't be on together with Force (both use the mouse).
ThrowSpeed1=40     ; m/s
ThrowSpeed2=80
ThrowSpeed3=140
Range=80           ; how far away you can grab things (m)
AimWeapon=24       ; weapon used for aiming: 24 Desert Eagle, 22 Pistol, 41 Spraycan
Cost1=6            ; per grab
Cost2=10
Cost3=15

[Power.Force]
; LMB = push everything in front away, RMB = pull it toward CJ
; levels: radius/strength. Can't be on together with Telekinesis (both use the mouse).
Radius1=14         ; m
Radius2=24
Radius3=40
PushSpeed1=25      ; m/s at the center
PushSpeed2=45
PushSpeed3=80
PullSpeed1=16      ; m/s
PullSpeed2=26
PullSpeed3=40
Cooldown=0.6       ; seconds between blasts
Cost1=10
Cost2=16
Cost3=25

[Power.LightningStrike]
; point the camera (crosshair in the screen center) and click LMB
; levels: 1 one bolt (car-bomb blast), 2 three bolts + fire, 3 six-bolt storm (aircraft-size blast)
; every strike throws everything around with a shockwave. Can't be on with Telekinesis/Force (mouse).
Bolts1=1
Bolts2=3
Bolts3=6
Spread1=0          ; m: how far extra bolts land from the target
Spread2=7
Spread3=12
ShockRadius1=12    ; m
ShockRadius2=20
ShockRadius3=32
ShockSpeed1=24     ; m/s at the center
ShockSpeed2=40
ShockSpeed3=60
Range=300          ; m
Cooldown=0.8       ; seconds between strikes
Cost1=12
Cost2=20
Cost3=35

[Power.FireTrail]
; levels: how long each flame burns (s); SpreadN = how many times a flame may spread (0 = never)
Duration1=2
Duration2=4
Duration3=8
Spread1=0
Spread2=0
Spread3=1
Spacing=1.5        ; meters between flames
Drain1=1.5
Drain2=3
Drain3=5

[Power.BulletTime]
; levels: game speed (1.0 = normal; minimum 0.05)
Scale1=0.60
Scale2=0.35
Scale3=0.15
PlayerNormalSpeed=1 ; CJ's animations (walking, running, fighting) stay at normal speed
TintAlpha=35       ; blue screen tint strength 0-255 (0 = none)
Drain1=5
Drain2=9
Drain3=15

[Power.Invulnerability]
Drain=3

; ===== Spawn (own section in the menu: Left/Right pick, Enter use; no energy cost) =====

[Power.SpawnVehicle]
; all spawnable vehicles; Left/Right in the menu (Shift = 10 at a time)
Model=411          ; vehicle selected at startup (400-611), e.g. 411 Infernus, 520 Hydra, 432 Rhino

[Power.GiveWeapon]
Weapon=38          ; weapon selected at startup (weapon type ID, e.g. 38 Minigun, 31 M4, 35 Rocket Launcher)
Ammo=500           ; ammo per gun (melee weapons get 1)

[Power.AddMoney]
; amounts: $1,000 / $10,000 / $100,000 / $1,000,000 / $10,000,000

; ===== World (own section in the menu; no energy cost) =====

[Power.Gravity]
; levels: 1 Moon, 2 Mars, 3 Zero-G, 4 Heavy (gravity multiplier for everything)
Moon=0.17
Mars=0.38
ZeroG=0.02
Heavy=2.5

[Power.VehicleHandling]
; while CJ drives: hold TurboKey = turbo, JumpKey = jump; always: extra grip, tyres don't burst, auto-flip
; levels: 1 Sport, 2 Race, 3 Rocket
TurboKey=SHIFT
JumpKey=J
TurboAccel1=12     ; m/s per second
TurboAccel2=25
TurboAccel3=50
TopSpeed1=55       ; m/s with turbo
TopSpeed2=85
TopSpeed3=140
Grip1=2            ; how fast sideways sliding is removed (per second)
Grip2=4
Grip3=8
Jump1=6            ; m/s upward
Jump2=9
Jump3=14

[Power.Chaos]
; levels: 1 Meteors, 2 Exploding Traffic, 3 Flying Cars, 4 Riot. Mission vehicles are never touched.
MeteorInterval=0.7   ; seconds
ExplodeInterval=2.5
LaunchInterval=1.2
Radius=60            ; m around CJ

[Power.Reactions]
; while any superpower is on. levels: 1 Fear (people flee), 2 Fear + Police
Radius=35          ; m
PoliceStars=2
